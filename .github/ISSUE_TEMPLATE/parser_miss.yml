name: Reference parsed wrongly
description: citetrust extracted the wrong title/author/year (or missed an entry)
labels: [parser]
body:
  - type: textarea
    id: entry
    attributes:
      label: The reference text exactly as it appears in the document
      render: text
    validations:
      required: true
  - type: textarea
    id: got
    attributes:
      label: Output of `citetrust FILE --list` for that entry
      render: text
  - type: input
    id: style
    attributes:
      label: Citation style / file type (APA, IEEE, Chicago, BibTeX, DOCX...)
